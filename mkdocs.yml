# Gerado e mantido pelo fluxo de documentação local.
site_name: SICI — Documentação Técnica
site_description: Auditoria técnica e rastreabilidade de dados do webscraper SICI.
docs_dir: docs
site_dir: .docs/mkdoc
use_directory_urls: true
exclude_docs: |
  diagramas/*
theme:
  name: material
  language: pt-BR
  font:
    text: Overpass
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
nav:
  - Início: index.md
  - Fluxo dos dados: data-lineage.md
  - Arquitetura: architecture.md
  - Avaliação técnica: technical-review.md
  - Manutenção: documentation-maintenance.md
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - assets/mermaid.min.js
  - assets/mermaid-init.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
