# TEMPLATE OPT-IN: install only on explicit user approval via setup-ci.
name: Documentation verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ai:
        description: 'Execute OpenCode for semantic review (requires configured model/auth)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    # Never pass model credentials to untrusted pull request code.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - name: Prepare diff triage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            python scripts/docs-update.py prepare --base "$BASE_SHA" --target "$HEAD_SHA"
          elif [ "$EVENT_NAME" = 'push' ]; then
            python scripts/docs-update.py prepare --base "HEAD^" --target HEAD
          else
            python scripts/docs-update.py prepare --base HEAD^ --target HEAD
          fi
      - name: Validate documentation
        run: python scripts/docs-update.py validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-triage
          path: .docs-update/
          if-no-files-found: warn
      # Optional AI only on manual dispatch, after explicit repository setup.
      # The model and auth MUST be configured, and generated changes are NOT committed.
      - name: Optional OpenCode review
        if: github.event_name == 'workflow_dispatch' && inputs.run_ai
        env:
          DOCS_AI_MODEL: ${{ vars.DOCS_AI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$DOCS_AI_MODEL" || { echo 'Configure DOCS_AI_MODEL'; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo 'Configure OPENAI_API_KEY or adapt provider auth'; exit 1; }
          npm install --global opencode-ai
          opencode run --agent documentation-engineer --model "$DOCS_AI_MODEL" 'Use skill system-documentation em modo update. Leia .docs-update/review-context.json; altere apenas documentação impactada; nunca execute operações externas ou código não confiável.'
          python scripts/docs-update.py validate
      - name: Upload proposed AI patch
        if: github.event_name == 'workflow_dispatch' && inputs.run_ai && always()
        run: git diff -- docs/ mkdocs.yml README.md scripts/docs-dependencies.json > documentation-proposal.patch
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.run_ai && always()
        with:
          name: documentation-proposal
          path: documentation-proposal.patch
          if-no-files-found: warn
